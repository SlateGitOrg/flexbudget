[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexbudget"
version = "0.1.0"
description = "Flexible-budget variance for an outpatient clinic network: volume, mix, wage-rate and efficiency parts that sum to the cent, with a Power BI (PBIP) model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "flexbudget contributors" }]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flexbudget = "flexbudget.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flexbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]
